name: Verify and deploy Library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build for the repository path
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Stamp the published release
        run: |
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; writeFileSync('dist/release.json', JSON.stringify({ commit: process.env.GITHUB_SHA }) + '\n')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live release
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in {1..12}; do
            published=$(curl --fail --silent --show-error --max-time 20 "${PUBLISHED_URL%/}/release.json?commit=$EXPECTED_SHA" | jq -r '.commit') || published=""
            if [ "$published" = "$EXPECTED_SHA" ]; then
              echo "Verified the live release: $EXPECTED_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The live website is not serving the expected release."
          exit 1
